name: PR Pipeline

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }} # checkout source branch (not detached head)
        fetch-depth: 0 # fetch all history

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: |
          3.10
          3.11
          3.12
          3.13

    - name: Install dependencies
      run: |
        python -m pip install tox

    - name: Run tox tests
      run: |
        # set git user (required for git commands in tests)
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # restore main but remain on current branch
        git checkout main
        git switch -
        
        # run tests
        tox -e pr