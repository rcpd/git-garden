name: PR Pipeline

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: |
          3.10
          3.13
    - name: Install dependencies
      run: |
        python -m pip install tox
    - name: Run tox tests
      run: |
        # set git user (required for git commands in tests)
        git config --global user.name "rcpd"
        git config --global user.email "5835162+rcpd@users.noreply.github.com"
        tox -e pr