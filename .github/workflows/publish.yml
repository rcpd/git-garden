name: Release

on:
  release:
    types: [created]

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/git-garden

    permissions:
      id-token: write # pypi OIDC auth

    steps:
      - uses: actions/checkout@v4

      - name: Install Hatch
        run: pip install hatch

      - name: Build package distributions
        run: hatch build

      - name: Publish package distributions to PyPI
        run: hatch publish