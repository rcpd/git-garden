[project]
name = "git-garden"
dynamic = ["version"]
requires-python = ">=3.8"

[tool.pytest.ini_options]
addopts = "-rs --cov git_garden --cov-report xml:cov.xml --cov-report term"

[tool.coverage.run]
source = ["./git_garden"]

[tool.ruff]
# The defaults + ANN (flake8-annotations for typing)
# + D* pydocstyle to catch missing docstrings + misc style conventions
lint.select = ["E4", "E7", "E9", "F", "ANN", "D101", "D102", "D103", "D106", "D201", "D202", 
"D207", "D208", "D209", "D210", "D211", "D213", "D300", "D301", "D400", "D403", "D415", "D417", "D419"]

# ANN101: Ignore requirement for "self" refs to be typed (Self type not introduced until py3.11 [PEP 673])
lint.ignore = ["ANN101", ] 

[tool.pydoclint]
style = "sphinx"
exclude = "venv|.tox|.git"

# these are already enforced through ruff (pydocstyle)
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false