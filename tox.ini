# TODO: move to pyproject.toml (when implemented)

[tox]
envlist = py{3.7,3.8,3.11}

[testenv]
deps =
    -r dev-requirements.txt

commands =
    ruff format . --check
    ruff check .
    mypy -m git_garden
    python -m pytest

[testenv:py37]
commands =
    {[testenv]commands}

[testenv:py{3.8,3.11}]
commands =
    pydoclint .
    {[testenv]commands}